name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PNPM
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: pnpm run build

      - name: Prune development dependencies
        run: pnpm prune --production

      - name: Copy files to EC2 via SCP
        uses: appleboy/scp-action@5bb815ae7f76baf13e1646dc59b8239beeb6ed57 # master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'dist/,node_modules/,package.json,pnpm-lock.yaml'
          target: '/home/ubuntu/var/www/auth-backend'

      - name: Restart PM2 on EC2
        uses: appleboy/ssh-action@068c0c7a4e59a5ae12fb7cb454b05735d830c82b # master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/var/www/auth-backend

            # 1. Load environment profiles to restore interactive PATH variables
            [ -f ~/.profile ] && . ~/.profile
            [ -f ~/.bashrc ] && . ~/.bashrc

            # 2. Load NVM if present and select default version
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              \. "$NVM_DIR/nvm.sh"
              nvm use default || nvm use node || true
            fi

            # 3. Add custom npm global bin path to PATH
            export PATH="$PATH:$HOME/.npm-global/bin"

            # 4. Manually search and add NVM node version bin folder to PATH if still not found
            if ! command -v node &> /dev/null || ! command -v npm &> /dev/null; then
              NVM_NODE_BIN=$(find "$HOME/.nvm/versions/node" -maxdepth 3 -type d -name "bin" 2>/dev/null | head -n 1)
              if [ -n "$NVM_NODE_BIN" ]; then
                export PATH="$NVM_NODE_BIN:$PATH"
              fi
            fi

            # 5. If PM2 still not found, search NVM versions folder for it
            if ! command -v pm2 &> /dev/null; then
              PM2_PATH=$(find "$HOME/.nvm/versions/node" -maxdepth 4 -type f -name "pm2" 2>/dev/null | head -n 1)
              if [ -n "$PM2_PATH" ]; then
                export PATH="$(dirname "$PM2_PATH"):$PATH"
              fi
            fi

            # 6. Safety check: Ensure node and npm are available before installing dependencies
            if ! command -v node &> /dev/null || ! command -v npm &> /dev/null; then
              echo "Error: node or npm not found in PATH ($PATH). Ensure Node.js is installed on the EC2 host." >&2
              exit 1
            fi

            # 7. Install PM2 in user-space if still not found
            if ! command -v pm2 &> /dev/null; then
              echo "PM2 not found. Installing..."
              npm install pm2 -g --prefix ~/.npm-global
            fi

            # 8. Install production dependencies on server
            npm install --production

            # 9. Restart or start application with PM2
            pm2 restart auth-backend-app || pm2 start dist/main.js --name "auth-backend-app"
