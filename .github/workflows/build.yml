name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PNPM
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: pnpm run build

      - name: Prune development dependencies
        run: pnpm prune --production

      - name: Copy files to EC2 via SCP
        uses: appleboy/scp-action@5bb815ae7f76baf13e1646dc59b8239beeb6ed57 # master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'package.json,pnpm-lock.yaml,pnpm-workspace.yaml,dist/,apps/demo/package.json,apps/demo/dist/,packages/core/package.json,packages/core/dist/,packages/nestjs-adapter/package.json,packages/nestjs-adapter/dist/'
          target: '/home/ubuntu/var/www/auth-backend'

      - name: Restart PM2 on EC2
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/var/www/auth-backend

            if ! command -v node &> /dev/null; then
              echo "Node not found. Installing Node.js..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            sudo npm install -g pnpm pm2

            pnpm install --prod --frozen-lockfile

            echo "=== Workspace Diagnostics ==="
            echo "Current Dir: $(pwd)"
            echo "Root files:"
            ls -la
            echo "Apps demo files:"
            ls -la apps/demo/ || true
            echo "Packages core files:"
            ls -la packages/core/ || true
            echo "Packages adapter files:"
            ls -la packages/nestjs-adapter/ || true
            echo "Root node_modules/@auth-template:"
            ls -la node_modules/@auth-template/ || true
            echo "Demo node_modules/@auth-template:"
            ls -la apps/demo/node_modules/@auth-template/ || true

            if pm2 describe auth-backend-app &> /dev/null; then
              pm2 restart auth-backend-app
            else
              pm2 start apps/demo/dist/main.js --name "auth-backend-app"
            fi
